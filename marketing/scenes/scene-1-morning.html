<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morning round - Max's Poo Crew</title>
<link rel="stylesheet" href="_scene.css">
<style>
/* Scene 1 - Morning round. The default palette: early sun, long light, a
   black Lab. This is the plain reading of the story, and the one to show
   first. Every other scene is this one with a different palette and cast. */
:root{ --coat:#2E2724; --coat-2:#453A34 }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A dog does its business in a fenced yard, the Max's Poo Crew
     scooper walks the same line and clears it, and the yard is left clean.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop class="sky-1" offset="0"/><stop class="sky-2" offset="1"/>
    </linearGradient>
    <!-- One picket, tiled. Twenty-odd rects by hand would say the same thing
         and be twenty-odd chances to fat-finger an x. -->
    <pattern id="pickets" x="0" y="0" width="48" height="190" patternUnits="userSpaceOnUse">
      <rect class="fence" x="2" y="0" width="32" height="190" rx="7"/>
      <rect class="fence-2" x="34" y="0" width="12" height="190" rx="4" opacity=".55"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="720" height="700" fill="url(#sky)"/>
  <circle class="sun-glow" cx="566" cy="196" r="118"/>
  <circle class="sun" cx="566" cy="196" r="62"/>

  <g class="cloud">
    <ellipse cx="130" cy="176" rx="66" ry="27"/>
    <ellipse cx="186" cy="166" rx="46" ry="33"/>
    <ellipse cx="82"  cy="184" rx="40" ry="21"/>
  </g>
  <g class="cloud cloud--2">
    <ellipse cx="440" cy="326" rx="54" ry="21"/>
    <ellipse cx="486" cy="318" rx="38" ry="26"/>
  </g>

  <!-- neighbour's roofline, well back -->
  <path class="house" d="M40,470 h190 v96 h-190 z" opacity=".85"/>
  <path class="roof" d="M24,472 L135,398 L246,472 z" opacity=".85"/>
  <path class="house" d="M556,486 h150 v80 h-150 z" opacity=".7"/>
  <path class="roof" d="M542,488 L631,430 L720,488 z" opacity=".7"/>

  <!-- trees behind the fence -->
  <g opacity=".9">
    <rect class="trunk" x="316" y="452" width="20" height="120" rx="8"/>
    <circle class="tree" cx="326" cy="432" r="74"/>
    <circle class="tree" cx="272" cy="462" r="48"/>
    <circle class="tree" cx="380" cy="460" r="52"/>
  </g>

  <!-- fence -->
  <rect x="0" y="472" width="720" height="190" fill="url(#pickets)"/>
  <rect class="fence-2" x="0" y="512" width="720" height="13" opacity=".45"/>
  <rect class="fence-2" x="0" y="606" width="720" height="13" opacity=".45"/>

  <!-- hedge along the foot of the fence -->
  <g class="hedge">
    <ellipse cx="70"  cy="666" rx="96" ry="46"/>
    <ellipse cx="238" cy="672" rx="86" ry="40"/>
    <ellipse cx="410" cy="666" rx="98" ry="44"/>
    <ellipse cx="596" cy="672" rx="104" ry="42"/>
  </g>
  <rect class="hedge-2" x="0" y="676" width="720" height="26"/>

  <!-- lawn, with the mow stripes running away from the viewer -->
  <rect class="lawn-far" x="0" y="676" width="720" height="120"/>
  <rect class="lawn" x="0" y="784" width="720" height="496"/>
  <path class="stripe" d="M0,784 h150 L96,1280 H0 z"/>
  <path class="stripe" d="M262,784 h132 L404,1280 H196 z"/>
  <path class="stripe" d="M506,784 h124 L720,1280 H520 z"/>

  <!-- what the yard looked like before anybody came: one pile already down -->
  <g transform="translate(180,988)"><g class="pile pile--old">
    <ellipse class="pile-a" cx="0"  cy="-9"  rx="31" ry="13"/>
    <ellipse class="pile-b" cx="-3" cy="-22" rx="23" ry="11"/>
    <ellipse class="pile-a" cx="2"  cy="-33" rx="15" ry="8"/>
  </g></g>

  <!-- and the one the dog is about to add -->
  <g transform="translate(460,988)"><g class="pile pile--new">
    <ellipse class="pile-a" cx="0"  cy="-9"  rx="29" ry="12"/>
    <ellipse class="pile-b" cx="-3" cy="-21" rx="21" ry="10"/>
    <ellipse class="pile-a" cx="2"  cy="-31" rx="14" ry="7"/>
  </g></g>

  <!-- the dog: drawn facing right, standing on y=0 of its own group -->
  <g transform="translate(540,988)"><g class="dog">
    <g class="dog-rig">
      <path class="dog-tail dog-body" d="M-90,-142 q-50,-4 -66,-58 l28,-13 q13,40 44,50 z"/>

      <rect class="leg leg--b dog-body" x="-82" y="-116" width="28" height="120" rx="14"/>
      <rect class="leg dog-body"        x="-50" y="-116" width="28" height="120" rx="14"/>
      <rect class="leg leg--b dog-body" x="42"  y="-116" width="28" height="120" rx="14"/>
      <rect class="leg dog-body"        x="72"  y="-116" width="28" height="120" rx="14"/>

      <ellipse class="dog-body"  cx="0" cy="-126" rx="95" ry="51"/>
      <ellipse class="dog-belly" cx="8" cy="-104" rx="72" ry="29"/>

      <path class="dog-body" d="M54,-162 q32,-20 60,-10 l6,46 q-36,10 -60,-4 z"/>
      <circle class="dog-body" cx="114" cy="-194" r="47"/>
      <ellipse class="dog-body"  cx="160" cy="-180" rx="33" ry="22"/>
      <ellipse class="dog-belly" cx="163" cy="-173" rx="24" ry="13"/>
      <circle class="dog-nose" cx="187" cy="-188" r="9"/>
      <ellipse class="dog-eye" cx="124" cy="-208" rx="9" ry="10"/>
      <circle class="dog-pupil" cx="127" cy="-208" r="5"/>
      <path class="dog-body" d="M94,-226 q-27,-6 -31,27 q-4,35 21,43 q10,-35 10,-70 z"/>

      <path class="dog-bandana"   d="M74,-158 q35,17 72,4 l-9,-27 q-31,10 -57,-2 z"/>
      <path class="dog-bandana-2" d="M120,-148 l17,10 l6,-23 z"/>
    </g>
  </g></g>

  <!-- the crew, walking the same line the dog just walked -->
  <g transform="translate(0,988)"><g class="person">
    <g transform="scale(1.34)">
    <g class="p-leg p-leg--b">
      <rect class="p-pants" x="-15" y="-150" width="27" height="124" rx="11"/>
      <rect class="p-boot"  x="-19" y="-34"  width="37" height="21" rx="8"/>
    </g>
    <g class="p-leg">
      <rect class="p-pants" x="7"  y="-150" width="27" height="124" rx="11"/>
      <rect class="p-boot"  x="5"  y="-34"  width="37" height="21" rx="8"/>
    </g>

    <path class="p-shirt"   d="M-23,-266 q28,-13 56,0 l11,118 q-40,13 -77,0 z"/>
    <path class="p-shirt-2" d="M-22,-178 q37,12 76,0 l2,21 q-41,12 -80,0 z"/>

    <path class="p-shirt" d="M-25,-256 q-17,31 -13,68 l19,4 q0,-35 12,-60 z"/>
    <ellipse class="p-bag" cx="-36" cy="-162" rx="21" ry="27"/>

    <circle class="p-skin" cx="13" cy="-296" r="31"/>
    <path class="p-cap" d="M-19,-304 q7,-35 43,-29 q23,4 25,29 z"/>
    <rect class="p-cap-brim" x="19" y="-308" width="42" height="10" rx="5"/>

    <g class="p-arm">
      <path class="p-shirt" d="M29,-260 q27,27 35,62 l-19,10 q-10,-33 -31,-53 z"/>
      <line class="p-pole" x1="57" y1="-192" x2="97" y2="-48"/>
      <path class="p-scoop"   d="M75,-60 l45,0 l-7,46 l-33,0 z"/>
      <path class="p-scoop-2" d="M75,-60 l45,0 l-3,13 l-39,0 z"/>
    </g>
    </g>
  </g></g>

  <!-- the payoff: clean grass, caught in the light -->
  <g class="spark" style="animation-delay:0s">
    <path d="M188,930 l7,20 l20,7 l-20,7 l-7,20 l-7,-20 l-20,-7 l20,-7 z"/>
  </g>
  <g class="spark" style="animation-delay:.16s">
    <path d="M470,900 l6,17 l17,6 l-17,6 l-6,17 l-6,-17 l-17,-6 l17,-6 z"/>
  </g>
  <g class="spark" style="animation-delay:.3s">
    <path d="M330,1046 l5,15 l15,5 l-15,5 l-5,15 l-5,-15 l-15,-5 l15,-5 z"/>
  </g>
</svg>

<!-- Real text over the scene, never drawn into it: the number is the one
     thing on here that must never be wrong. -->
<div class="endcard">
  <span class="logo"><img src="../../img/logo-full.webp" alt="Max's Poo Crew"></span>
  <p class="slogan">We scoop your yard.<br><em>You enjoy it.</em></p>
  <span class="rule"></span>
  <p class="phone">636-681-4832</p>
  <p class="web">maxspoocrew.com</p>
  <p class="area">St. Louis &amp; St. Charles Counties &middot; Mon&ndash;Sun, 7am&ndash;6pm</p>
</div>
</div>

<script>
/* Open this file with ?t=6.3 to freeze the loop at 6.3 seconds. The exporter
   pulls its frames that way, because Chrome runs transform and opacity
   animations on the compositor, where the headless virtual clock does not
   reach them - every frame would otherwise come back identical.
   With no ?t= in the URL this does nothing and the scene simply plays. */
(() => {
  const q = new URLSearchParams(location.search).get('t');
  if (q === null) return;
  const at = parseFloat(q) * 1000;
  const seek = () => document.getAnimations().forEach((a) => {
    a.currentTime = at;
    a.pause();
  });
  addEventListener('load', seek);
  if (document.fonts) document.fonts.ready.then(seek);
})();
</script>
</body>
</html>
