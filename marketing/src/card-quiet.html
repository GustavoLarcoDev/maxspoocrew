<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Card - Quiet - Max's Poo Crew</title>
<link rel="stylesheet" href="_base.css">
<style>
/* The restrained one. Same bones as Classic - lockup left, contact right,
   tagline along the foot - with the divider dropped and the red pulled back to
   a single rule. What carries the card here is the white space, which is the
   half of Jan's design people tend to miss: that card is mostly empty.

   Vistaprint sheet: bleed 3.61 x 2.11 in, trim 3.5 x 2, safe 3.36 x 1.86.
   Live copy stays 0.2in in from the sheet edge. Nothing bleeds. */
@page{ size: 3.61in 2.11in; margin:0 }
.sheet{width:3.61in;height:2.11in;background:#fff;color:var(--ink)}

/* --- front --------------------------------------------------------------- */
.front{display:flex;flex-direction:column}
.front .main{flex:1;display:flex;align-items:center;gap:.24in;
  padding:.18in .22in 0}
.front .logo{flex:none;width:1.2in;height:auto;display:block}
.front .contact{flex:1;min-width:0}
.front .org{font-family:var(--body);font-weight:700;font-size:.062in;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.front .phone{font-family:var(--display);font-size:.238in;color:var(--ink);
  letter-spacing:-.022em;white-space:nowrap;margin-top:.045in;line-height:1}
.front .service{font-family:var(--body);font-weight:700;font-size:.061in;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin-top:.05in}
.front .row{font-size:.077in;color:var(--ink-2);line-height:1.52;
  margin-top:.075in}
.front .base{border-top:1px solid var(--rule);margin:0 .22in;
  padding:.1in 0 .2in;text-align:center}
.front .tag{font-family:var(--display);font-size:.092in;color:var(--ink-2)}
.front .tag em{font-style:normal;color:var(--red-ink)}

/* --- back ---------------------------------------------------------------- */
.back{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:.18in;text-align:center}
.back .logo{width:.82in;height:auto;display:block}
.back .rule{width:.5in;height:1.5px;background:var(--rule-2);
  margin:.08in 0 .065in;display:block}
.back .dom{font-family:var(--display);font-size:.09in;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink)}
.back .qr{width:.54in;margin-top:.075in;background:#fff;padding:0}
.back .qr img{width:100%;height:auto;display:block}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front">
  <div class="main">
    <img class="logo" src="../../img/logo-full.webp" alt="Max's Poo Crew">
    <div class="contact">
      <p class="org">Max&rsquo;s Poo Crew</p>
      <p class="phone">636-681-4832</p>
      <p class="service">Dog waste removal</p>
      <p class="row">maxspoocrew@outlook.com<br>St. Louis &amp; St. Charles Counties</p>
    </div>
  </div>
  <div class="base">
    <span class="tag">We Scoop <em>Poop</em></span>
  </div>
</div>

<!-- back -->
<div class="sheet back">
  <img class="logo" src="../../img/logo-full.webp" alt="Max's Poo Crew">
  <span class="rule"></span>
  <p class="dom">maxspoocrew.com</p>
  <span class="qr"><img src="qr-card.svg" alt="QR code to the free quote page"></span>
</div>

</body>
</html>
