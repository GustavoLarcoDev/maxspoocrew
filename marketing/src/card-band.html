<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Card - Band - Max's Poo Crew</title>
<link rel="stylesheet" href="_base.css">
<style>
/* The loudest of the three white cards. Lockup left, contact right, and the
   tagline sitting in a red band across the foot rather than in plain type -
   the one place this set puts ink at the trim.

   That band is why the sheet matters: it runs the full 3.61in and bleeds off
   both sides, so a cut that drifts sideways still lands in red rather than
   beside it. Its height is set well over the 0.055in bleed for the same
   reason - a shallow band would show white along the bottom if the cut
   drifted up.

   The band's bottom padding is deliberately larger than its top. 0.055in of
   the foot is trimmed off, so .19in in the file reads as .135in on the
   finished card - which is what makes the band look evenly set once cut.

   Vistaprint sheet: bleed 3.61 x 2.11 in, trim 3.5 x 2, safe 3.36 x 1.86.
   Type inside the band stays 0.2in in from the sheet edge. */
@page{ size: 3.61in 2.11in; margin:0 }
.sheet{width:3.61in;height:2.11in;background:#fff;color:var(--ink)}

/* --- front --------------------------------------------------------------- */
.front{display:flex;flex-direction:column}
.front .main{flex:1;display:flex;align-items:center;padding:.18in .22in 0}
.front .logo{flex:none;width:1.06in;height:auto;display:block}
.front .div{flex:none;width:1px;height:1.1in;background:rgba(200,16,46,.28);
  margin:0 .17in}
.front .contact{flex:1;min-width:0}
.front .org{font-family:var(--body);font-weight:700;font-size:.063in;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.front .phone{font-family:var(--display);font-size:.234in;color:var(--red);
  letter-spacing:-.022em;white-space:nowrap;margin-top:.04in;line-height:1}
.front .service{font-family:var(--body);font-weight:700;font-size:.062in;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin-top:.05in}
.front .rule{width:.4in;height:1.5px;background:var(--red);margin:.08in 0;
  display:block}
.front .row{font-size:.078in;color:var(--ink-2);line-height:1.52}
.front .band{background:var(--red);color:#fff;padding:.12in .22in .19in;
  display:flex;align-items:center;justify-content:space-between}
.front .tag{font-family:var(--display);font-size:.092in;letter-spacing:.02em}
.front .tag em{font-style:normal;color:var(--butter)}
.front .dom{font-family:var(--display);font-size:.092in;color:#fff}

/* --- back ---------------------------------------------------------------- */
.back{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:.18in;text-align:center}
.back .logo{width:.82in;height:auto;display:block}
.back .rule{width:.5in;height:1.5px;background:var(--red);margin:.08in 0 .065in;
  display:block}
.back .dom{font-family:var(--display);font-size:.09in;letter-spacing:.1em;
  text-transform:uppercase;color:var(--red-ink)}
.back .qr{width:.54in;margin-top:.075in;background:#fff;padding:0}
.back .qr img{width:100%;height:auto;display:block}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front">
  <div class="main">
    <img class="logo" src="../../img/logo-full.webp" alt="Max's Poo Crew">
    <span class="div"></span>
    <div class="contact">
      <p class="org">Max&rsquo;s Poo Crew</p>
      <p class="phone">636-681-4832</p>
      <p class="service">Dog waste removal</p>
      <span class="rule"></span>
      <p class="row">maxspoocrew@outlook.com</p>
      <p class="row">St. Louis &amp; St. Charles Counties</p>
    </div>
  </div>
  <div class="band">
    <span class="tag">We scoop it. <em>You enjoy it.</em></span>
    <span class="dom">maxspoocrew.com</span>
  </div>
</div>

<!-- back -->
<div class="sheet back">
  <img class="logo" src="../../img/logo-full.webp" alt="Max's Poo Crew">
  <span class="rule"></span>
  <p class="dom">maxspoocrew.com</p>
  <span class="qr"><img src="qr-card.svg" alt="QR code to maxspoocrew.com"></span>
</div>

</body>
</html>
