<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="1">
<title>Tailgate magnet strip 24x6 - Max's Poo Crew</title>
<link rel="stylesheet" href="_base.css">
<style>
/* Trim 24 x 6 in. Sheet carries 0.125in bleed on every side.
   Sized for a pickup tailgate or the back of a trailer. */
@page{ size: 24.25in 6.25in; margin:0 }

.sheet{width:24.25in;height:6.25in;display:flex;align-items:center;
  gap:.6in;padding:.125in .8in}

.markbox{flex:none;width:4.5in;background:#fff;border-radius:.3in;
  padding:.2in;display:grid;place-items:center}
.markbox img{width:100%;height:auto;display:block}

.mid{flex:1;min-width:0}
.service{font-family:var(--display);font-size:.44in;letter-spacing:.02em;
  text-transform:uppercase;color:var(--butter);line-height:1}
.phone{font-family:var(--display);font-size:1.5in;line-height:.94;color:#fff;
  letter-spacing:-.035em;margin-top:.08in;white-space:nowrap}

.end{flex:none;text-align:right}
.web{font-family:var(--display);font-size:.62in;color:#fff;letter-spacing:-.02em}
.end .pill{font-size:.3in;padding:.13in .28in;margin-top:.16in}
.area{font-family:var(--body);font-weight:700;font-size:.24in;margin-top:.14in;
  color:rgba(255,255,255,.88)}
</style>
</head>
<body>

<div class="sheet panel-red">
  <div class="markbox">
    <img src="../../img/logo-full.webp" alt="Max's Poo Crew">
  </div>

  <div class="mid">
    <p class="service">Dog waste removal</p>
    <p class="phone">636&#8209;681&#8209;4832</p>
  </div>

  <div class="end">
    <p class="web">maxspoocrew.com</p>
    <span class="pill">First cleanup free</span>
    <p class="area">St.&nbsp;Louis &amp; St.&nbsp;Charles Counties</p>
  </div>
</div>

</body>
</html>
