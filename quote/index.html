<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free quote — Max's Poo Crew</title>
<meta name="description" content="Get a free quote from Max's Poo Crew. Tell us how many dogs and where you are.">
<link rel="canonical" href="https://maxspoocrew.com/quote/">
<meta name="robots" content="noindex, follow">
<!-- =============================================================================
     Why this file exists.

     Every printed QR code points at https://maxspoocrew.com/quote/ - the cards,
     the door hangers, the flyers, the rack cards and the mini cards. The three
     Vistaprint cards ordered separately point there too.

     The current live site serves a real page at that address. The site in this
     repo does not: it is one page, and the form is the #quote section of it. So
     the day this site replaces the current one, every code already printed
     would land on a 404 - and a QR on paper cannot be corrected.

     This keeps the address alive and sends it to the form. If a standalone
     quote page is ever built here, replace this file with it and the printed
     codes keep working either way.

     The redirect is a meta refresh at 0s plus a script, rather than a server
     rule, because GitHub Pages serves static files and offers no redirects.
     ========================================================================== -->
<meta http-equiv="refresh" content="0; url=/maxspoocrew/#quote">
<script>
  // Runs before the meta refresh in practice, and keeps the anchor when the
  // site is served from a domain root rather than the project path.
  (function () {
    var base = location.pathname.replace(/\/quote\/?$/, '/') || '/';
    location.replace(base + '#quote' + location.search);
  })();
</script>
<style>
  :root{ --red:#C8102E; --ink:#331411; --cream:#FFF1EB }

  body{min-height:100vh;display:grid;place-items:center;background:var(--cream);

    text-decoration:none;font-weight:800;padding:13px 24px;border-radius:999px}
</style>
</head>
<body>
  <main>

  </main>
</body>
