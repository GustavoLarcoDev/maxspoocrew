<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Card - Crest - Max's Poo Crew</title>
<link rel="stylesheet" href="../../print/src/_base.css">
<style>
/* Trim 3.5 x 2 in, US standard. 0.125in bleed all round.
   Dark card in the spirit of the Missouri Search Dogs card: near-black
   ground, the mark boxed on the left, a thin gold rule dividing it from a
   stacked contact block on the right, a rule-and-row footer band. MPC's own
   ink/butter tokens stand in for the gold. */
@page{ size: 3.75in 2.25in; margin:0 }
.sheet{width:3.75in;height:2.25in;background:var(--ink);color:var(--cream)}

/* --- front --------------------------------------------------------------- */
.front{display:flex;flex-direction:column;height:100%}
.front .main{flex:1;display:flex;align-items:center;padding:.22in .26in 0}
.front .mark{flex:none;width:.92in;height:.92in;border-radius:.09in;background:#fff;
  display:grid;place-items:center;padding:.06in}
.front .mark img{width:100%;height:auto;display:block}
.front .div{flex:none;width:1px;align-self:stretch;background:rgba(255,209,102,.4);
  margin:0 .2in}
.front .contact{flex:1;min-width:0}
.front .org{font-family:var(--body);font-weight:700;font-size:.075in;
  letter-spacing:.14em;text-transform:uppercase;color:var(--butter)}
.front .phone{font-family:var(--display);font-size:.235in;color:#fff;
  letter-spacing:-.02em;white-space:nowrap;margin-top:.04in;line-height:1}
.front .tag{font-size:.078in;letter-spacing:.03em;color:rgba(255,241,235,.72);
  margin-top:.055in}
.front .rule{width:.4in;height:2px;background:var(--butter);margin:.09in 0}
.front .web{font-size:.086in;color:rgba(255,241,235,.9)}
.front .base{border-top:1px solid rgba(255,209,102,.4);padding:.09in .26in .13in;
  display:flex;align-items:center;justify-content:space-between}
.front .offer{font-family:var(--body);font-weight:700;font-size:.065in;
  letter-spacing:.1em;text-transform:uppercase;color:var(--butter)}
.front .dom{font-family:var(--display);font-size:.1in;color:#fff}

/* --- back ---------------------------------------------------------------- */
.back{height:100%;padding:.24in .26in;display:flex;gap:.2in;align-items:center}
.back .qr{width:.84in;flex:none;background:#fff;padding:.055in;border-radius:.08in}
.back .qr img{width:100%;height:auto;display:block}
.back .info{flex:1;min-width:0}
.back h2{font-size:.145in;color:#fff;line-height:1.12;font-family:var(--display);
  font-weight:900}
.back .rule{width:.32in;height:2px;background:var(--butter);margin:.075in 0 .085in}
.back .row{font-size:.083in;color:rgba(255,241,235,.85);line-height:1.44}
.back .row b{color:var(--butter);font-weight:700}
.back .pill{font-size:.076in;padding:.04in .09in;margin-top:.08in;background:var(--butter);
  color:var(--ink);font-family:var(--display);border-radius:99in;display:inline-block}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front">
  <div class="main">
    <span class="mark"><img src="../../img/logo-mark.webp" alt="Max's Poo Crew"></span>
    <span class="div"></span>
    <div class="contact">
      <p class="org">Max&rsquo;s Poo Crew</p>
      <p class="phone">636-681-4832</p>
      <p class="tag">We scoop it. You enjoy it.</p>
      <span class="rule"></span>
      <p class="web">maxspoocrew.com</p>
    </div>
  </div>
  <div class="base">
    <span class="offer">First cleanup free</span>
    <span class="dom">maxspoocrew.com</span>
  </div>
</div>

<!-- back -->
<div class="sheet back">
  <span class="qr"><img src="../../print/src/qr-card.svg" alt="QR code to maxspoocrew.com"></span>
  <div class="info">
    <h2>Get a price in about a minute.</h2>
    <span class="rule"></span>
    <p class="row"><b>Call or text</b> 636-681-4832</p>
    <p class="row"><b>Email</b> maxspoocrew@outlook.com</p>
    <p class="row"><b>Hours</b> Mon&ndash;Sat, 7am&ndash;6pm</p>
    <span class="pill">First cleanup free with any plan</span>
  </div>
</div>

</body>
</html>
