<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Card - Paper - Max's Poo Crew</title>
<link rel="stylesheet" href="../../print/src/_base.css">
<style>
/* Trim 3.5 x 2 in, US standard. 0.125in bleed all round.
   White card, white background: logo left, contact right, tagline on the
   bottom edge. The plainest of the three - one thin red rule is the only
   colour on the front besides the logo itself. */
@page{ size: 3.75in 2.25in; margin:0 }
.sheet{width:3.75in;height:2.25in;background:#fff;color:var(--ink)}

/* --- front --------------------------------------------------------------- */
.front{padding:.26in .28in .22in;display:flex;flex-direction:column;height:100%}
.front .row{flex:1;display:flex;align-items:center;justify-content:space-between;gap:.2in}
.front .mark{width:.92in;height:auto;display:block;flex:none}
.front .contact{text-align:right}
.front .phone{font-family:var(--display);font-size:.27in;color:var(--ink);
  letter-spacing:-.025em;white-space:nowrap;line-height:1}
.front .web{font-family:var(--display);font-size:.125in;color:var(--red-ink);
  margin-top:.05in}
.front .area{font-size:.075in;color:var(--ink-3);margin-top:.06in;line-height:1.3}
.front .base{border-top:1.5px solid var(--rule);padding-top:.1in;
  display:flex;align-items:center;justify-content:space-between}
.front .tag{font-family:var(--display);font-size:.105in;color:var(--ink-2);
  letter-spacing:-.01em}
.front .tag em{font-style:normal;color:var(--red-ink)}
.front .rule{width:.34in;height:.032in}

/* --- back ---------------------------------------------------------------- */
.back{padding:.26in .28in;display:flex;gap:.2in;align-items:center;height:100%}
.back .qr{width:.86in;flex:none;background:#fff;border:1.5px solid var(--rule);
  padding:.06in;border-radius:.08in}
.back .qr img{width:100%;height:auto;display:block}
.back .info{flex:1;min-width:0}
.back h2{font-size:.155in;color:var(--ink);line-height:1.12}
.back .rule{width:.34in;height:.03in;margin:.075in 0 .09in}
.back .row{font-size:.086in;color:var(--ink-2);line-height:1.46}
.back .row b{color:var(--ink);font-weight:700}
.back .pill{font-size:.08in;padding:.045in .1in;margin-top:.09in}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front">
  <div class="row">
    <img class="mark" src="../../img/logo-mark.webp" alt="Max's Poo Crew">
    <div class="contact">
      <p class="phone">636-681-4832</p>
      <p class="web">maxspoocrew.com</p>
      <p class="area">St. Louis &amp; St. Charles County, MO</p>
    </div>
  </div>
  <div class="base">
    <p class="tag">We scoop it. <em>You enjoy it.</em></p>
    <span class="rule" style="background:var(--red)"></span>
  </div>
</div>

<!-- back -->
<div class="sheet back">
  <span class="qr"><img src="../../print/src/qr-card.svg" alt="QR code to maxspoocrew.com"></span>
  <div class="info">
    <h2>Get a price in about a minute.</h2>
    <span class="rule" style="background:var(--red);display:block"></span>
    <p class="row"><b>Call or text</b> 636-681-4832</p>
    <p class="row"><b>Email</b> maxspoocrew@outlook.com</p>
    <p class="row"><b>Hours</b> Mon&ndash;Sat, 7am&ndash;6pm</p>
    <span class="pill">First cleanup free with any plan</span>
  </div>
</div>

</body>
</html>
