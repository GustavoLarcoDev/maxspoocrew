<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Card - Patch - Max's Poo Crew</title>
<link rel="stylesheet" href="../../print/src/_base.css">
<style>
/* Vistaprint standard business card sheet - see card-crest.html for the full
   trim/safe arithmetic. Same brief as Crest (mark left, contact right, tagline
   along the bottom); here the mark is ringed like a stitched patch and the
   phone carries the gold instead of the eyebrow. */
@page{ size: 3.61in 2.11in; margin:0 }
/* _base.css paints the page canvas white. The sheet lands on a fractional
   pixel at 3.61 x 2.11in, so that white shows through as a hairline along the
   bottom edge - inside the bleed, but a cut that drifts outward would leave it
   on the finished card. Painting the canvas the card colour removes it. */
html,body{background:var(--ink)}
.sheet{width:3.61in;height:2.11in;background:var(--ink);color:var(--cream)}

/* --- front --------------------------------------------------------------- */
.front{display:flex;flex-direction:column;padding:.2in}
.front .row{flex:1;display:flex;align-items:center;gap:.17in}
.front .mark{flex:none;width:1.05in;height:1.05in;border-radius:50%;background:#fff;
  border:1.5px solid var(--butter);display:grid;place-items:center;padding:.075in;
  overflow:hidden}
.front .mark img{width:100%;height:auto;display:block}
.front .contact{flex:1;min-width:0}
.front .org{font-family:var(--body);font-weight:700;font-size:.063in;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(255,241,235,.72)}
.front .phone{font-family:var(--display);font-size:.25in;color:var(--butter);
  letter-spacing:-.02em;white-space:nowrap;margin-top:.035in;line-height:1}
.front .service{font-family:var(--body);font-weight:700;font-size:.063in;
  letter-spacing:.11em;text-transform:uppercase;color:rgba(255,241,235,.7);
  margin-top:.045in}
.front .row2{font-size:.078in;color:rgba(255,241,235,.88);line-height:1.5;
  margin-top:.06in}
.front .base{border-top:1px solid rgba(255,209,102,.4);padding-top:.105in;
  display:flex;align-items:center;justify-content:space-between}
.front .tag{font-family:var(--display);font-size:.098in;color:#fff}
.front .tag em{font-style:normal;color:var(--butter)}
.front .dom{font-family:var(--display);font-size:.095in;color:rgba(255,241,235,.8)}

/* --- back ---------------------------------------------------------------- */
.back{padding:.2in;display:flex;gap:.19in;align-items:center}
.back .qr{width:1.02in;flex:none;background:#fff;padding:.055in;border-radius:.08in}
.back .qr img{width:100%;height:auto;display:block}
.back .info{flex:1;min-width:0}
.back h2{font-size:.148in;color:#fff;line-height:1.14;font-family:var(--display);
  font-weight:900}
.back .rule{width:.34in;height:1.5px;background:var(--butter);margin:.08in 0 .09in;
  display:block}
.back .row{font-size:.084in;color:rgba(255,241,235,.85);line-height:1.5}
.back .row b{color:var(--butter);font-weight:700}
.back .pill{display:inline-block;background:var(--butter);color:var(--ink);
  font-family:var(--display);border-radius:99in;font-size:.076in;
  padding:.042in .095in;margin-top:.09in}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front">
  <div class="row">
    <span class="mark"><img src="../../img/logo-full.webp" alt="Max's Poo Crew"></span>
    <div class="contact">
      <p class="org">Max&rsquo;s Poo Crew</p>
      <p class="phone">636-681-4832</p>
      <p class="service">Dog waste removal</p>
      <p class="row2">St. Louis &amp; St. Charles County</p>
    </div>
  </div>
  <div class="base">
    <span class="tag">We scoop it. <em>You enjoy it.</em></span>
    <span class="dom">maxspoocrew.com</span>
  </div>
</div>

<!-- back -->
<div class="sheet back">
  <span class="qr"><img src="../../print/src/qr-card.svg" alt="QR code to maxspoocrew.com"></span>
  <div class="info">
    <h2>Get a price in about a minute.</h2>
    <span class="rule"></span>
    <p class="row"><b>Call or text</b> 636-681-4832</p>
    <p class="row"><b>Email</b> maxspoocrew@outlook.com</p>
    <p class="row"><b>Hours</b> Mon&ndash;Sat, 7am&ndash;6pm</p>
    <span class="pill">First cleanup free with any residential plan</span>
  </div>
</div>

</body>
</html>
