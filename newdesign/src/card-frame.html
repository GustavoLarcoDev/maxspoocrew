<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Card - Vignette - Max's Poo Crew</title>
<link rel="stylesheet" href="../../print/src/_base.css">
<style>
/* Trim 3.5 x 2 in, US standard. 0.125in bleed all round.
   Same dark-card brief as Crest and Patch, with a red-to-ink vignette behind
   the mark and a thin full frame inset from the trim - the most "premium
   letterhead" of the three. */
@page{ size: 3.75in 2.25in; margin:0 }
.sheet{width:3.75in;height:2.25in;background:var(--ink);color:var(--cream);
  position:relative}
.frame{position:absolute;inset:.11in;border:1pt solid rgba(255,209,102,.55);
  border-radius:.05in;pointer-events:none}

/* --- front --------------------------------------------------------------- */
.front{position:relative;height:100%;padding:.26in .3in;display:flex;
  flex-direction:column;justify-content:space-between}
.front .row{display:flex;align-items:center;gap:.2in}
.front .mark{flex:none;width:.9in;height:.9in;border-radius:.1in;
  background:radial-gradient(circle at 35% 30%,var(--red-deep),var(--ink) 72%);
  display:grid;place-items:center;padding:.08in}
.front .mark img{width:100%;height:auto;display:block}
.front .contact{flex:1;min-width:0}
.front .org{font-family:var(--body);font-weight:700;font-size:.07in;
  letter-spacing:.14em;text-transform:uppercase;color:var(--butter)}
.front .phone{font-family:var(--display);font-size:.225in;color:#fff;
  letter-spacing:-.02em;white-space:nowrap;margin-top:.045in;line-height:1}
.front .web{font-size:.086in;color:var(--butter);margin-top:.045in}
.front .tag{text-align:center;font-family:var(--display);font-size:.09in;
  letter-spacing:.02em;color:rgba(255,241,235,.82)}

/* --- back ---------------------------------------------------------------- */
.back{position:relative;height:100%;padding:.24in .28in;display:flex;
  gap:.2in;align-items:center}
.back .qr{width:.8in;flex:none;background:#fff;padding:.05in;border-radius:.07in}
.back .qr img{width:100%;height:auto;display:block}
.back .info{flex:1;min-width:0}
.back h2{font-size:.14in;color:#fff;line-height:1.12;font-family:var(--display);
  font-weight:900}
.back .rule{width:.3in;height:2px;background:var(--butter);margin:.07in 0 .08in}
.back .row{font-size:.08in;color:rgba(255,241,235,.85);line-height:1.42}
.back .row b{color:var(--butter);font-weight:700}
.back .pill{font-size:.073in;padding:.038in .085in;margin-top:.075in;
  background:var(--butter);color:var(--ink);font-family:var(--display);
  border-radius:99in;display:inline-block}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front">
  <div class="frame"></div>
  <div class="row">
    <span class="mark"><img src="../../img/logo-mark.webp" alt="Max's Poo Crew"></span>
    <div class="contact">
      <p class="org">Max&rsquo;s Poo Crew</p>
      <p class="phone">636-681-4832</p>
      <p class="web">maxspoocrew.com</p>
    </div>
  </div>
  <p class="tag">We scoop it &middot; You enjoy it</p>
</div>

<!-- back -->
<div class="sheet back">
  <div class="frame"></div>
  <span class="qr"><img src="../../print/src/qr-card.svg" alt="QR code to maxspoocrew.com"></span>
  <div class="info">
    <h2>Get a price in about a minute.</h2>
    <span class="rule"></span>
    <p class="row"><b>Call or text</b> 636-681-4832</p>
    <p class="row"><b>Email</b> maxspoocrew@outlook.com</p>
    <p class="row"><b>Hours</b> Mon&ndash;Sat, 7am&ndash;6pm</p>
    <span class="pill">First cleanup free with any plan</span>
  </div>
</div>

</body>
</html>
