<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Card - Frame - Max's Poo Crew</title>
<link rel="stylesheet" href="../../print/src/_base.css">
<style>
/* Trim 3.5 x 2 in, US standard. 0.125in bleed all round.
   White card, logo left, contact right, tagline on the bottom - the same
   brief as Paper and Ribbon, dressed with a thin red frame inset from the
   trim and the logo mark set inside a ringed circle. The most "formal
   letterhead" of the three. */
@page{ size: 3.75in 2.25in; margin:0 }
.sheet{width:3.75in;height:2.25in;background:#fff;color:var(--ink);position:relative}
.frame{position:absolute;inset:.14in;border:1.25pt solid var(--red);border-radius:.06in}

/* --- front --------------------------------------------------------------- */
.front{position:relative;height:100%;padding:.3in .34in .26in;display:flex;
  flex-direction:column;justify-content:space-between}
.front .row{display:flex;align-items:center;justify-content:space-between;gap:.22in}
.front .badge{flex:none;width:1.12in;border-radius:.09in;overflow:hidden;
  border:1.25pt solid var(--red);display:grid;place-items:center;padding:.06in}
.front .badge img{width:100%;height:auto;display:block}
.front .contact{text-align:right}
.front .phone{font-family:var(--display);font-size:.25in;color:var(--ink);
  letter-spacing:-.02em;white-space:nowrap;line-height:1}
.front .web{font-family:var(--display);font-size:.12in;color:var(--red-ink);
  margin-top:.05in}
.front .area{font-size:.072in;color:var(--ink-3);margin-top:.055in;line-height:1.3}
.front .tag{text-align:center;font-family:var(--display);font-size:.1in;
  letter-spacing:.03em;text-transform:uppercase;color:var(--red-ink)}

/* --- back ---------------------------------------------------------------- */
.back{position:relative;height:100%;padding:.28in .32in;display:flex;
  gap:.2in;align-items:center}
.back .qr{width:.8in;flex:none;border:1.25pt solid var(--red);padding:.055in;
  border-radius:.08in}
.back .qr img{width:100%;height:auto;display:block}
.back .info{flex:1;min-width:0}
.back h2{font-size:.15in;color:var(--ink);line-height:1.12}
.back .rule{width:.32in;height:.03in;background:var(--red);margin:.075in 0 .085in;
  display:block}
.back .row{font-size:.083in;color:var(--ink-2);line-height:1.44}
.back .row b{color:var(--ink);font-weight:700}
.back .pill{font-size:.076in;padding:.04in .09in;margin-top:.08in}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front">
  <div class="frame"></div>
  <div class="row">
    <span class="badge"><img src="../../img/logo-mark.webp" alt="Max's Poo Crew"></span>
    <div class="contact">
      <p class="phone">636-681-4832</p>
      <p class="web">maxspoocrew.com</p>
      <p class="area">St. Louis &amp; St. Charles County, MO</p>
    </div>
  </div>
  <p class="tag">We scoop it &middot; You enjoy it</p>
</div>

<!-- back -->
<div class="sheet back">
  <div class="frame"></div>
  <span class="qr"><img src="../../print/src/qr-card.svg" alt="QR code to maxspoocrew.com"></span>
  <div class="info">
    <h2>Get a price in about a minute.</h2>
    <span class="rule"></span>
    <p class="row"><b>Call or text</b> 636-681-4832</p>
    <p class="row"><b>Email</b> maxspoocrew@outlook.com</p>
    <p class="row"><b>Hours</b> Mon&ndash;Sat, 7am&ndash;6pm</p>
    <span class="pill">First cleanup free with any plan</span>
  </div>
</div>

</body>
</html>
