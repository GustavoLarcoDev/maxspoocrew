<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Business card, bold - Max's Poo Crew</title>
<link rel="stylesheet" href="_base.css">
<style>
/* Trim 3.5 x 2 in. This one is cut to Vistaprint's own sheet, 3.61 x 2.11 in,
   so the bleed is 0.055in a side rather than the 0.125in the rest of the
   collateral carries. Live copy still sits 0.125in inside the trim, which on
   this sheet is 0.18in in from the edge — hence the 0.24in padding.

   The phone is the product: someone reads this card once, and the only thing
   they need off it is the number. So the number is the biggest thing on it. */
@page{ size: 3.61in 2.11in; margin:0 }

.sheet{width:3.61in;height:2.11in}

/* --- front --------------------------------------------------------------- */
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:.24in;text-align:center}
.front .mark{width:1.12in;height:auto;display:block}
.front .phone{font-family:var(--display);font-size:.315in;color:#fff;
  letter-spacing:-.03em;margin-top:.07in;white-space:nowrap;line-height:1}
.front .web{font-family:var(--display);font-size:.125in;color:var(--butter);
  margin-top:.055in;letter-spacing:.01em}

/* --- back ---------------------------------------------------------------- */
.back{display:flex;gap:.17in;padding:.24in;align-items:center}
.back .qr{width:.82in;flex:none;padding:0;background:none}
.back .info{flex:1;min-width:0}
.back h2{font-size:.15in;color:var(--ink);line-height:1.1}
.back .rule{width:.32in;height:.028in;margin:.06in 0 .075in}
.back .row{font-size:.085in;color:var(--ink-2);line-height:1.42}
.back .row b{color:var(--ink);font-weight:700}
.back .pill{font-size:.079in;padding:.042in .095in;margin-top:.075in}
.back .fine{font-size:.066in;color:var(--ink-3);margin-top:.06in;line-height:1.3}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front panel-red">
  <img class="mark" src="../../img/logo-mark.webp" alt="Max's Poo Crew">
  <p class="phone">636-681-4832</p>
  <p class="web">maxspoocrew.com</p>
</div>

<!-- back -->
<div class="sheet back panel-cream">
  <span class="qr"><img src="qr-card.svg" alt="QR code to maxspoocrew.com"></span>
  <div class="info">
    <h2>We scoop it. You enjoy it.</h2>
    <span class="rule"></span>
    <p class="row"><b>Call or text</b> 636-681-4832</p>
    <p class="row"><b>Email</b> maxspoocrew@outlook.com</p>
    <p class="row"><b>Hours</b> Mon&ndash;Sat, 7am&ndash;6pm</p>
    <span class="pill">First cleanup free with any plan</span>
    <p class="fine">St. Louis &amp; St. Charles County, MO. Plans from $65/mo.
      One-time cleanup $100.</p>
  </div>
</div>

</body>
</html>
