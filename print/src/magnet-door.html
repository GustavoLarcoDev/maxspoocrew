<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="1">
<title>Car door magnet 18x12 - Max's Poo Crew</title>
<link rel="stylesheet" href="_base.css">
<style>
/* Trim 18 x 12 in. Sheet carries 0.125in bleed on every side. */
@page{ size: 18.25in 12.25in; margin:0 }

.sheet{width:18.25in;height:12.25in;display:flex;flex-direction:column;
  padding:.125in}

.body{flex:1;display:flex;align-items:center;gap:.7in;padding:.55in .75in}

.markbox{flex:none;width:5.4in;background:#fff;border-radius:.4in;
  padding:.3in;display:grid;place-items:center}
.markbox img{width:100%;height:auto;display:block}

.copy{flex:1;min-width:0}

/* Sized to read from about 30 feet across a parking lot. The phone number is
   the biggest thing on the panel after the name, because it is the only thing
   a driver behind you can act on. */
.service{font-family:var(--display);font-size:.56in;letter-spacing:.02em;
  text-transform:uppercase;color:var(--butter);line-height:1}
.phone{font-family:var(--display);font-size:1.38in;line-height:.92;color:#fff;
  letter-spacing:-.035em;margin-top:.18in;white-space:nowrap}
.web{font-family:var(--display);font-size:.72in;color:#fff;margin-top:.14in;
  letter-spacing:-.02em}
.strip{margin-top:.3in;display:flex;align-items:center;gap:.28in}
.strip .pill{font-size:.32in;padding:.14in .32in}
.area{font-family:var(--body);font-weight:700;font-size:.28in;
  color:rgba(255,255,255,.92)}

/* A dark band across the foot keeps the sheet from reading top-heavy and
   gives the tagline somewhere to live. */
.footband{flex:none;height:1.85in;display:flex;align-items:center;
  justify-content:space-between;padding:0 .95in}
.tagline{font-family:var(--display);font-size:.62in;color:var(--butter);
  letter-spacing:-.015em}
.hours{font-family:var(--body);font-weight:700;font-size:.34in;
  color:rgba(255,241,235,.86)}
</style>
</head>
<body>

<div class="sheet panel-red">
  <div class="body">
    <div class="markbox">
      <img src="../../img/logo-full.webp" alt="Max's Poo Crew">
    </div>
    <div class="copy">
      <p class="service">Dog waste removal</p>
      <p class="phone">618&#8209;719&#8209;3802</p>
      <p class="web">maxspoocrew.com</p>
      <div class="strip">
        <span class="pill">First cleanup free</span>
        <span class="area">St.&nbsp;Louis &amp; St.&nbsp;Charles County</span>
      </div>
    </div>
  </div>

  <div class="footband panel-ink">
    <p class="tagline">No pile left behind.</p>
    <p class="hours">Mon&ndash;Sat &middot; 7am&ndash;6pm</p>
  </div>
</div>

</body>
</html>
