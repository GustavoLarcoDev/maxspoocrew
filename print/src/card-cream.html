<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pages" content="2">
<title>Business card, cream - Max's Poo Crew</title>
<link rel="stylesheet" href="_base.css">
<style>
/* Trim 3.5 x 2 in on Vistaprint's 3.61 x 2.11 in sheet — 0.055in bleed a side.
   Live copy stays 0.125in inside the trim, so 0.18in from the sheet edge.

   The logo-led one. The full lockup already carries the dogs, the name and the
   paws, so the front says almost nothing else and lets the mark be the card.
   The colour lands on the back instead, which is the half people keep. */
@page{ size: 3.61in 2.11in; margin:0 }

.sheet{width:3.61in;height:2.11in}

/* --- front --------------------------------------------------------------- */
.front{display:flex;align-items:center;gap:.18in;padding:.24in}
.front .logo{width:1.24in;height:auto;display:block;flex:none}
.front .copy{flex:1;min-width:0}
.front h1{font-size:.155in;color:var(--ink);line-height:1.08}
.front h1 em{font-style:normal;color:var(--red-ink)}
.front .rule{width:.3in;height:.028in;margin:.07in 0 .08in}
.front .phone{font-family:var(--display);font-size:.175in;color:var(--ink);
  letter-spacing:-.02em;white-space:nowrap;line-height:1}
.front .web{font-family:var(--body);font-weight:600;font-size:.086in;
  color:var(--ink-2);margin-top:.042in}

/* --- back ---------------------------------------------------------------- */
.back{display:flex;gap:.17in;padding:.24in;align-items:center}
.back .qr{width:.8in;flex:none}
.back .info{flex:1;min-width:0}
.back .eyebrow{font-size:.076in;color:var(--butter)}
.back h2{font-size:.132in;color:#fff;line-height:1.12;margin-top:.048in}
.back .row{font-size:.082in;color:rgba(255,241,235,.88);line-height:1.45;
  margin-top:.055in}
.back .row b{color:var(--butter);font-weight:700}
.back .pill{font-size:.076in;padding:.04in .09in;margin-top:.08in}
</style>
</head>
<body>

<!-- front -->
<div class="sheet front panel-cream">
  <img class="logo" src="../../img/logo-full.webp" alt="Max's Poo Crew">
  <div class="copy">
    <h1>We scoop it.<br><em>You enjoy it.</em></h1>
    <span class="rule"></span>
    <p class="phone">636-681-4832</p>
    <p class="web">maxspoocrew.com</p>
  </div>
</div>

<!-- back -->
<div class="sheet back panel-red">
  <span class="qr"><img src="qr-card.svg" alt="QR code to maxspoocrew.com"></span>
  <div class="info">
    <p class="eyebrow eyebrow--on-red">Dog waste removal</p>
    <h2>Get a price in about a minute.</h2>
    <p class="row"><b>Call or text</b> 636-681-4832<br>
      <b>Email</b> maxspoocrew@outlook.com<br>
      <b>Serving</b> St. Louis &amp; St. Charles County, MO</p>
    <span class="pill">First cleanup free with any plan</span>
  </div>
</div>

</body>
</html>
